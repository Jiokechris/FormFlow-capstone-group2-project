name: Build and Deploy FormFlow (Azure)

on:
  push:
    branches:
      - main

env:
  DOCKERHUB_USER: aniyikaye
  FRONTEND_IMAGE: formflow-frontend
  BACKEND_IMAGE: formflow-backend

jobs:
  deploy:
    name: Build, Push and Deploy (Azure)
    runs-on: ubuntu-latest
    environment: Form-Flow-Proj

    steps:

      #################################################
      # Checkout Repository
      #################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      #################################################
      # Generate Image Tag (Git SHA)
      #################################################
      - name: Generate Image Tag
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      #################################################
      # Login to Docker Hub
      #################################################
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      #################################################
      # Build Frontend Image
      #################################################
      - name: Build Frontend Docker Image
        run: |
          docker build \
            --build-arg REACT_APP_API_BASE_URL="${{ secrets.REACT_APP_API_BASE_URL }}" \
            --build-arg APP_VERSION=$TAG \
            -t $DOCKERHUB_USER/$FRONTEND_IMAGE:$TAG \
            -t $DOCKERHUB_USER/$FRONTEND_IMAGE:latest \
            ./frontend

      #################################################
      # Build Backend Image
      #################################################
      - name: Build Backend Docker Image
        run: |
          docker build \
            --build-arg APP_VERSION=$TAG \
            -t $DOCKERHUB_USER/$BACKEND_IMAGE:$TAG \
            -t $DOCKERHUB_USER/$BACKEND_IMAGE:latest \
            ./backend

      #################################################
      # Push Frontend Image
      #################################################
      - name: Push Frontend Image
        run: |
          docker push $DOCKERHUB_USER/$FRONTEND_IMAGE:$TAG
          docker push $DOCKERHUB_USER/$FRONTEND_IMAGE:latest

      #################################################
      # Push Backend Image
      #################################################
      - name: Push Backend Image
        run: |
          docker push $DOCKERHUB_USER/$BACKEND_IMAGE:$TAG
          docker push $DOCKERHUB_USER/$BACKEND_IMAGE:latest

      #################################################
      # Deploy to Azure VM via SSH
      #################################################
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /opt/capstone
            if [ ! -d /opt/capstone/app/.git ]; then
              sudo rm -rf /opt/capstone/app
              git clone -b main https://github.com/${{ github.repository }}.git /opt/capstone/app
              sudo chown -R ${{ secrets.AZURE_VM_USER }}:${{ secrets.AZURE_VM_USER }} /opt/capstone/app
            fi
            cd /opt/capstone/app
            git fetch origin
            git reset --hard origin/main
            echo "${{ env.TAG }}" | sudo tee /opt/capstone/current_version
            rm -f .env
            echo DOCKERHUB_USER=${{ env.DOCKERHUB_USER }} > .env
            echo TAG=${{ env.TAG }} >> .env
            echo MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }} >> .env
            echo MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} >> .env
            echo MYSQL_USER=${{ secrets.MYSQL_USER }} >> .env
            echo MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} >> .env
            echo MYSQL_HOST=db >> .env
            echo REACT_APP_API_BASE_URL=/api >> .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
            docker images | grep formflow
            docker image prune -f

      #################################################
      # Deployment Summary
      #################################################
      - name: Deployment Summary
        run: |
          echo "======================================"
          echo "Azure deployment completed successfully"
          echo "======================================"
          echo ""
          echo "Version Running : $TAG"
          echo ""
          echo "Frontend Image:"
          echo "$DOCKERHUB_USER/$FRONTEND_IMAGE:$TAG"
          echo ""
          echo "Backend Image:"
          echo "$DOCKERHUB_USER/$BACKEND_IMAGE:$TAG"
